version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
    gosec:
      excludes:
        - G304 # file paths come from operator-controlled environment variables
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
